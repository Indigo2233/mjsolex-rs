[package]
name = "mjsolex"
version = "0.3.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Native mobile reconstruction for Sol’Ex solar scans"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
png = "0.18"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity", "default_fonts", "glow"] }
jni = "0.21"
rustix = { version = "1", features = ["event", "fs"] }
tempfile = "3"
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
